[device]
codename = "onyx"
brand = "Redmi"
model = "Redmi Turbo 4 Pro"
ab = true
soc = { hans = "第四代骁龙®8s移动平台", hant = "Snapdragon® 8s Gen 4 行動平台", en = "Snapdragon® 8s Gen 4 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"
version = "0.3.1-onyx.4"

[display]
# The panel's own mode: 1280 by 2772, the 6.83 inch 1.5K panel the POCO F7
# carries as well. At 512 dpi the layout is 400 dp wide, the width the
# tested phones' pages are laid out at.
width = 1280
height = 2772
density = 512
diagonal = 6.83

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The touchscreen: Novatek's NT38771, the o10u panel's controller, behind
# Xiaomi's touch layer. Both are the phone's own vendor_dlkm modules.
load = ["nt38771_touch", "xiaomi_touch"]

# The programs that use the phone's keys are not named here: Skyward reads
# them, how each starts and what it registers, from the installed system's
# own partitions, so an update that renames them is followed as it is.

# The driver resets the controller as it connects to it, and it comes back
# sending only raw frames, so the panel's own input device carries no touch
# at all: reading /dev/input/event7 directly gets nothing, which this phone
# was tried on. Xiaomi's own touch report program reads the raw frames from
# /dev/xiaomi-touch, has the system's touch algorithm turn them into
# touches with /odm/lib64/libtouchreport.so, and writes them back to the
# panel's input device, which the pages then take. Its config files name the
# panel: o10u_nova_csot_thp_config.ini for this CSOT panel. The program is
# built for Android and loads its modules from /odm/lib64.
[[service]]
path = "/odm/bin/touch_report_debug"
libraries = ["/odm/lib64", "/vendor/lib64", "/vendor/lib64/hw", "/system/lib64"]
user = "root"
groups = ["root", "uhid", "input"]
capabilities = ["SYS_NICE"]

# WLAN: the WCN7750 on PCIe, driven by qca_cld3_wcn7750 over the icnss2
# platform driver. The RF-kill module the driver's cfg80211 needs is one of
# the kernel's own, in system_dlkm, and is loaded first. Once wpss_boot is
# written, icnss2 powers the chip up and loads its firmware from the vendor
# partition; wlan0 appears. The driver reads its settings and the MAC
# address through the firmware loader: the settings from the vendor
# partition, the address from persist. wpa_supplicant runs on the recovery's
# own libraries, with the system's newer runtime libraries (Android 17's
# recovery no longer carries libvndksupport / libdl_android) from the
# installed system's /system, and the vendor interface's bundle. Whether a
# network joined reaches the internet is asked of the page Xiaomi's Chinese
# system asks.
[wlan]
modules = ["rfkill", "qca_cld3_wcn7750"]
writes = [
    { path = "/sys/kernel/icnss/wlan_en_delay", value = "1000" },
    { path = "/sys/kernel/icnss/wpss_boot", value = "1" },
]
firmware = [
    { name = "wlan/qca_cld/wcn7750/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/wcn7750/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/wcn7750/wlan_mac.bin", partition = "persist", path = "wlan/wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/mnt/system/system/lib64/bootstrap", "/mnt/system/system/lib64", "/vendor/lib64", "/system/lib64"]
preload = "/skyward/wpa-aidl-shim.so"
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"
skyward = "Remoparrot/skyward-onyx"

# The motor is the Awinic AW8697 on i2c 5-005a, behind the awinic_haptic
# driver. The driver's own switch plays its kept waveform for `duration`
# milliseconds at `gain`; `f0` says the motor swings at 169.6 Hz, in tenths
# of a hertz. Its force-feedback interface takes a waveform format of its
# own, so the click is played through these files instead.
[haptics]
activate = "/sys/bus/i2c/devices/5-005a/activate"
duration = "/sys/bus/i2c/devices/5-005a/duration"
effect = "/sys/bus/i2c/devices/5-005a/effect_id"
gain = "/sys/bus/i2c/devices/5-005a/gain"
resonance = "/sys/bus/i2c/devices/5-005a/f0"
strength = { lightest = 0.35, strongest = 1.0 }

# Xiaomi's memory extension keeps its swap file in /data/extm: six gigabytes
# under a name made afresh at every start, sealed with a key only that start
# of the phone had. Opening it in a later start answers ENOKEY, as the
# recovery's own backup found, and what it holds is memory, not the user's
# data: a restore would write back a swap file that cannot open. It is left
# out, as the phone's own system makes it again.
[backup]
data_skipped = ["extm"]

# The stock build the recovery is made on: the Chinese system's
# OS4.0.2.0, whose full update package on the phone maker's own download
# server holds the recovery partition the recovery is built on top of. The
# recovery partition is 104857600 bytes, as its AVB footer ends it.
[stock]
version = "OS4.0.2.0.XOLCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.2.0.XOLCNXM/onyx-ota_full-OS4.0.2.0.XOLCNXM-user-17.0-dbe344d29d.zip"
recovery = "ce53850714fe2ca9ab22600a00e71813df2775dc94244192c83a224d7ecd3357"
